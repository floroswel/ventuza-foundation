name: Android Release (AAB → Google Play)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      skip_play_upload:
        description: "Doar produce AAB (nu urca pe Play) — activează pt prima urcare manuală"
        required: true
        default: true
        type: boolean
      version:
        description: "Versiune SemVer (ex: 9.74.12). Gol = derivat automat din tag/timestamp."
        required: false
        default: ""
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build AAB & Upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (pentru @capacitor/cli — cere >=22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install web deps
        run: bun install

      - name: Build web bundle
        env:
          # Publishable keys (safe în bundle). Fallback la valorile din .env dacă lipsesc secretele repo.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://szzxhvvmwqvfyoldcuyz.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6enhodnZtd3F2ZnlvbGRjdXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzE5NTUsImV4cCI6MjA5NzU0Nzk1NX0.Wf-m_9h3GtQMV6zC6L6ti4ZlR1HCqqHhw4f5ilE-LTs' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'szzxhvvmwqvfyoldcuyz' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build:mobile

      - name: Add Android platform (dacă lipsește)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Injectează google-services.json (FCM)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 lipsește — push nativ FCM NU va funcționa pe device. Adaugă secretul în GitHub → Settings → Secrets → Actions."
          else
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
            test -s android/app/google-services.json
            echo "✓ google-services.json scris ($(stat -c%s android/app/google-services.json) bytes)"
          fi

      - name: Wire Firebase (google-services plugin + firebase-messaging)
        run: |
          ROOT_GRADLE=android/build.gradle
          APP_GRADLE=android/app/build.gradle
          # Plugin la nivel de root (dacă nu există deja)
          if ! grep -q "com.google.gms:google-services" "$ROOT_GRADLE"; then
            python3 <<'PY'
          p = "android/build.gradle"
          s = open(p).read()
          if "dependencies {" in s:
              s = s.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
          open(p, 'w').write(s)
          PY
            echo "✓ google-services classpath adăugat în android/build.gradle"
          fi
          # Apply plugin + dependință messaging la nivel app
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo "" >> "$APP_GRADLE"
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            echo "✓ google-services plugin aplicat în app/build.gradle"
          fi
          if ! grep -q "firebase-messaging" "$APP_GRADLE"; then
            python3 <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          if "dependencies {" in s:
              s = s.replace(
                  "dependencies {",
                  "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')\n    implementation 'com.google.firebase:firebase-messaging'",
                  1,
              )
          open(p, 'w').write(s)
          PY
            echo "✓ firebase-messaging + BoM adăugate în app/build.gradle"
          fi

      - name: Hardening Manifest (allowBackup=false, dataExtraction=false)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Dating app — nu permite backup automat al datelor sensibile
          if grep -q 'android:allowBackup="true"' "$MANIFEST"; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MANIFEST"
            echo "✓ allowBackup=false"
          fi
          if ! grep -q 'android:dataExtractionRules' "$MANIFEST" && ! grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's|<application |<application android:allowBackup="false" |' "$MANIFEST"
            echo "✓ allowBackup=false injectat"
          fi


      - name: Derive versionCode & versionName din tag
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$MANUAL_VERSION" ]]; then
            RAW="$MANUAL_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="0.0.$(date +%s | tail -c 6)"
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$RAW"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RAW} (code=${CODE})"

      - name: Patch versionCode/versionName în build.gradle
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Decodează keystore-ul
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secretul ANDROID_KEYSTORE_BASE64 lipsește sau e gol."
            exit 1
          fi
          # Strip whitespace/newlines/CR și eventuale ghilimele din secret,
          # apoi decodează tolerant (base64 -d e strict la caractere non-alfabet).
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t "'"'" | base64 -d -i > android/app/release.keystore 2>/tmp/b64.err || {
            echo "::error::Decodarea base64 a keystore-ului a eșuat. Verifică ANDROID_KEYSTORE_BASE64 (fără prefix data:, fără ghilimele, doar caractere base64)."
            cat /tmp/b64.err || true
            exit 1
          }
          test -s android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          echo "Keystore size: $SIZE bytes"
          # PKCS12 începe cu 0x30 0x82 (SEQUENCE) — verificare sanity fără a expune conținut.
          head -c 2 android/app/release.keystore | od -An -tx1 | tr -d ' \n' | grep -qi '^3082' || {
            echo "::error::Fișierul decodat NU pare a fi un keystore valid (header greșit)."
            exit 1
          }

      - name: Verifică parolele keystore (fail-fast)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "→ Test 1: parola keystore-ului (ANDROID_KEYSTORE_PASSWORD)"
          if ! keytool -list -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" > /tmp/kt.out 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD este GREȘITĂ pentru keystore-ul din ANDROID_KEYSTORE_BASE64."
            cat /tmp/kt.out
            exit 1
          fi
          echo "→ Test 2: aliasul (ANDROID_KEY_ALIAS='$KEY_ALIAS') există în keystore"
          if ! keytool -list -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/kt.out 2>&1; then
            echo "::error::Aliasul '$KEY_ALIAS' NU există în keystore. Aliasuri disponibile:"
            keytool -list -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" | grep -i "alias name" || true
            exit 1
          fi
          echo "→ Test 3: parola cheii (ANDROID_KEY_PASSWORD) descifrează cheia privată"
          # `-certreq` cere descifrarea cheii private — funcționează atât pe JKS cât și pe PKCS12
          # (spre deosebire de `-keypasswd`, care nu e suportat pe PKCS12).
          if ! keytool -certreq -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" \
                -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /tmp/kt.out 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD este GREȘITĂ pentru aliasul '$KEY_ALIAS'."
            cat /tmp/kt.out
            echo ""
            echo "Fix: în GitHub → Settings → Secrets → Actions, actualizează ANDROID_KEY_PASSWORD"
            echo "cu parola reală a cheii din keystore. Pe PKCS12 (default modern),"
            echo "keyPassword TREBUIE să fie identic cu storePassword."
            exit 1
          fi
          echo "✓ Toate cele 3 secrete potrivesc keystore-ul."

      - name: Scrie keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Injectează signing config în build.gradle (dacă lipsește)
        run: |
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs" "$GRADLE"; then
            echo "Adding signingConfigs block..."
            # Inserează după linia "android {"
            python3 <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          signing = """
              signingConfigs {
                  release {
                      def props = new Properties()
                      def f = rootProject.file('keystore.properties')
                      if (f.exists()) {
                          props.load(new FileInputStream(f))
                          storeFile file(props['storeFile'])
                          storePassword props['storePassword']
                          keyAlias props['keyAlias']
                          keyPassword props['keyPassword']
                      }
                  }
              }
          """
          s = re.sub(r'(android\s*\{)', r'\1' + signing, s, count=1)
          # Aplică signingConfig pe buildType release
          if 'buildTypes' in s:
              s = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s, count=1
              )
          else:
              # Adaugă întreg blocul buildTypes înainte de închiderea android {}
              build_types = """
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          """
              # Inserează înainte de ultimul } al blocului android
              s = s.rstrip()
              # închide penultimul } (al android)
              idx = s.rfind('}')
              s = s[:idx] + build_types + '\n}\n'
          open(p, 'w').write(s)
          print("Injected signing config.")
          PY
          else
            echo "signingConfigs already present, skipping injection."
          fi
          echo "--- build.gradle after ---"
          cat "$GRADLE"

      - name: Build AAB semnat
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload artefact AAB (pentru inspecție)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish în Google Play
        if: ${{ github.event_name == 'push' || github.event.inputs.skip_play_upload != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ventuza.dating
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'draft' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          changesNotSentForReview: false

      - name: Curăță secretele de pe runner
        if: always()
        run: |
          rm -f android/app/release.keystore android/keystore.properties
