name: Android Release (AAB → Google Play)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      skip_play_upload:
        description: "Doar produce AAB (nu urca pe Play) — activează pt prima urcare manuală"
        required: true
        default: true
        type: boolean

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build AAB & Upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (pentru @capacitor/cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install web deps
        run: bun install

      - name: Build web bundle
        env:
          # Publishable keys (safe în bundle). Fallback la valorile din .env dacă lipsesc secretele repo.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://szzxhvvmwqvfyoldcuyz.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6enhodnZtd3F2ZnlvbGRjdXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzE5NTUsImV4cCI6MjA5NzU0Nzk1NX0.Wf-m_9h3GtQMV6zC6L6ti4ZlR1HCqqHhw4f5ilE-LTs' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'szzxhvvmwqvfyoldcuyz' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build

      - name: Add Android platform (dacă lipsește)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Derive versionCode & versionName din tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="0.0.$(date +%s | tail -c 6)"
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$RAW"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RAW} (code=${CODE})"

      - name: Patch versionCode/versionName în build.gradle
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Decodează keystore-ul
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
          echo "Keystore size: $(stat -c%s android/app/release.keystore) bytes"

      - name: Scrie keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Injectează signing config în build.gradle (dacă lipsește)
        run: |
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs" "$GRADLE"; then
            echo "Adding signingConfigs block..."
            # Inserează după linia "android {"
            python3 <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          signing = """
              signingConfigs {
                  release {
                      def props = new Properties()
                      def f = rootProject.file('keystore.properties')
                      if (f.exists()) {
                          props.load(new FileInputStream(f))
                          storeFile file(props['storeFile'])
                          storePassword props['storePassword']
                          keyAlias props['keyAlias']
                          keyPassword props['keyPassword']
                      }
                  }
              }
          """
          s = re.sub(r'(android\s*\{)', r'\1' + signing, s, count=1)
          # Aplică signingConfig pe buildType release
          if 'buildTypes' in s:
              s = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s, count=1
              )
          else:
              # Adaugă întreg blocul buildTypes înainte de închiderea android {}
              build_types = """
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          """
              # Inserează înainte de ultimul } al blocului android
              s = s.rstrip()
              # închide penultimul } (al android)
              idx = s.rfind('}')
              s = s[:idx] + build_types + '\n}\n'
          open(p, 'w').write(s)
          print("Injected signing config.")
          PY
          else
            echo "signingConfigs already present, skipping injection."
          fi
          echo "--- build.gradle after ---"
          cat "$GRADLE"

      - name: Build AAB semnat
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload artefact AAB (pentru inspecție)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish în Google Play
        if: ${{ github.event_name == 'push' || github.event.inputs.skip_play_upload != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.ventuza.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'draft' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          changesNotSentForReview: false

      - name: Curăță secretele de pe runner
        if: always()
        run: |
          rm -f android/app/release.keystore android/keystore.properties
