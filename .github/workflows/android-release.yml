name: Android Release (AAB → Google Play)

# Trigger:
#   - push de tag SemVer: v1.2.3 → track "internal" (default)
#   - manual din GitHub UI (workflow_dispatch) → poți alege track-ul
#
# Nu se declanșează pe push obișnuit — release-urile sunt intenționate.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      skip_play_upload:
        description: "Doar produce AAB (nu urca pe Play) — activează pt prima urcare manuală"
        required: true
        default: true
        type: boolean

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build AAB & Upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production   # protejat cu review + secrete separate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (pentru @capacitor/cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build

      - name: Add Android platform (dacă lipsește)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Derive versionCode & versionName din tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="0.0.$(date +%s | tail -c 6)"
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$RAW"
          # versionCode monoton: MAJOR*10_000 + MINOR*100 + PATCH  (max 99.99.99)
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RAW} (code=${CODE})"

      - name: Patch versionCode/versionName în build.gradle
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Decodează keystore-ul
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Scrie keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build AAB semnat
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload artefact AAB (pentru inspecție)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish în Google Play
        if: ${{ github.event_name == 'push' || github.event.inputs.skip_play_upload != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.ventuza.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'draft' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: fastlane/metadata/android
          changesNotSentForReview: false

      - name: Curăță secretele de pe runner
        if: always()
        run: |
          rm -f android/app/release.keystore android/keystore.properties
