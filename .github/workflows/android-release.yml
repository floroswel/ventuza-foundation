      - name: Hardening Manifest (allowBackup=false, dataExtraction=false)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Dating app — nu permite backup automat al datelor sensibile
          if grep -q 'android:allowBackup="true"' "$MANIFEST"; then
            sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MANIFEST"
            echo "✓ allowBackup=false"
          fi
          if ! grep -q 'android:dataExtractionRules' "$MANIFEST" && ! grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's|<application |<application android:allowBackup="false" |' "$MANIFEST"
            echo "✓ allowBackup=false injectat"
          fi
          # App Links obligatorii: suzeta.app trebuie să deschidă aplicația.
          if ! grep -q 'android:host="suzeta.app"' "$MANIFEST"; then
            echo "::error::Intent filter App Links pentru suzeta.app lipsește din AndroidManifest."
            exit 1
          fi
          if ! grep -q 'android:autoVerify="true"' "$MANIFEST"; then
            echo "::error::autoVerify lipsește din intent filter-ul App Links."
            exit 1
          fi
          echo "✓ App Links (suzeta.app, autoVerify) prezente"




      - name: Derive versionCode & versionName (release/version.json = sursă unică)
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f release/version.json ]; then
            echo "::error::release/version.json lipsește. Rulează \`bun run version:bump\`."
            exit 1
          fi
          JSON_NAME=$(python3 -c "import json;print(json.load(open('release/version.json'))['versionName'])")
          JSON_CODE=$(python3 -c "import json;print(json.load(open('release/version.json'))['versionCode'])")
          if [[ -n "${MANUAL_VERSION:-}" ]]; then
            RAW="$MANUAL_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="$JSON_NAME"
          fi
          # versionCode vine ÎNTOTDEAUNA din version.json (increment simplu,
          # 24→25→26...). Nu se derivează din tag cu formula MAJ*10000+MIN*100+PAT
          # — acea schemă intra în conflict cu codurile deja urcate pe Play și
          # declanșa respingeri "duplicat/învechit".
          CODE="$JSON_CODE"
          echo "name=${RAW}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RAW} (code=${CODE}, din version.json)"

      - name: Patch versionCode/versionName în build.gradle
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Decodează keystore-ul
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 nu este vizibil în environment-ul GitHub 'production' sau este gol."
            exit 1
          fi
          echo "Scope activ: GitHub Actions environment = production"
          echo "Lungime ANDROID_KEYSTORE_BASE64: ${#KEYSTORE_B64}"
          # Strip whitespace/newlines/CR și eventuale ghilimele din secret,
          # apoi decodează tolerant (base64 -d e strict la caractere non-alfabet).
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t "'"'" | base64 -d -i > android/app/release.keystore 2>/tmp/b64.err || {
            echo "::error::Decodarea base64 a keystore-ului a eșuat. Verifică ANDROID_KEYSTORE_BASE64 (fără prefix data:, fără ghilimele, doar caractere base64)."
            cat /tmp/b64.err || true
            exit 1
          }
          test -s android/app/release.keystore
          SIZE=$(stat -c%s android/app/release.keystore)
          echo "Keystore size: $SIZE bytes"
          KEYSTORE_SHA256="$(sha256sum android/app/release.keystore | awk '{print $1}')"
          echo "SHA-256 keystore decodat: $KEYSTORE_SHA256"
          echo "Compară-l cu fișierul NOU: sha256sum release.keystore"
          echo "Dacă diferă, ANDROID_KEYSTORE_BASE64 din environment-ul 'production' este încă cel vechi."
          # PKCS12 începe cu 0x30 0x82 (SEQUENCE) — verificare sanity fără a expune conținut.
          head -c 2 android/app/release.keystore | od -An -tx1 | tr -d ' \n' | grep -qi '^3082' || {
            echo "::error::Fișierul decodat NU pare a fi un keystore valid (header greșit)."
            exit 1
          }

      - name: Diagnostic + verificare secrete keystore (fail-fast)
        env:
          STORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Curăță CR/LF și spații de la început/sfârșit (cauza #1 de "wrong password"
          # când secretul a fost lipit cu newline la final).
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASSWORD="$(trim "$STORE_PASSWORD_RAW")"
          KEY_ALIAS="$(trim "$KEY_ALIAS_RAW")"
          KEY_PASSWORD="$(trim "$KEY_PASSWORD_RAW")"

          echo "Scope activ: GitHub Actions environment = production"
          echo "Lungimi secrete (raw → după trim; valorile NU sunt afișate):"
          echo "- ANDROID_KEYSTORE_PASSWORD: ${#STORE_PASSWORD_RAW} → ${#STORE_PASSWORD}"
          echo "- ANDROID_KEY_ALIAS: ${#KEY_ALIAS_RAW} → ${#KEY_ALIAS}"
          echo "- ANDROID_KEY_PASSWORD: ${#KEY_PASSWORD_RAW} → ${#KEY_PASSWORD}"
          if [ -z "$STORE_PASSWORD" ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD are lungimea 0 în environment-ul 'production'."; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "::error::ANDROID_KEY_ALIAS are lungimea 0 în environment-ul 'production'."; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "::error::ANDROID_KEY_PASSWORD are lungimea 0 în environment-ul 'production'."; exit 1; fi
          if [ "${#STORE_PASSWORD_RAW}" -ne "${#STORE_PASSWORD}" ] || [ "${#KEY_PASSWORD_RAW}" -ne "${#KEY_PASSWORD}" ] || [ "${#KEY_ALIAS_RAW}" -ne "${#KEY_ALIAS}" ]; then
            echo "::warning::Unul dintre secrete conținea spații/newline la capete — au fost eliminate automat."
          fi

          echo "→ Test 1: parola keystore-ului (ANDROID_KEYSTORE_PASSWORD)"
          if ! keytool -list -v -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" > /tmp/kt.out 2>&1; then
            echo "::error::FAIL Test 1 — ANDROID_KEYSTORE_PASSWORD nu deschide ANDROID_KEYSTORE_BASE64. Base64-ul poate fi vechi sau parola poate aparține altui keystore."
            cat /tmp/kt.out
            exit 1
          fi
          echo "✓ PASS Test 1 — keytool -list reușește cu ANDROID_KEYSTORE_PASSWORD"
          echo "Alias-uri găsite în keystore:"
          grep -i "^Alias name:" /tmp/kt.out || true
          grep -i "Keystore type:" /tmp/kt.out || true

          echo "→ Test 2: aliasul (ANDROID_KEY_ALIAS='$KEY_ALIAS') există în keystore"
          if ! keytool -list -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/kt.out 2>&1; then
            echo "::error::FAIL Test 2 — ANDROID_KEY_ALIAS nu există în keystore."
            cat /tmp/kt.out
            exit 1
          fi
          echo "✓ PASS Test 2 — ANDROID_KEY_ALIAS există"

          echo "→ Test 3: parola cheii (ANDROID_KEY_PASSWORD) descifrează cheia privată"
          EFFECTIVE_KEY_PASSWORD="$KEY_PASSWORD"
          if ! keytool -certreq -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" \
                -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /tmp/kt.out 2>&1; then
            echo "ANDROID_KEY_PASSWORD nu deschide cheia; încerc fallback cu storePassword (PKCS12 cere key==store)..."
            if keytool -certreq -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" \
                  -alias "$KEY_ALIAS" -keypass "$STORE_PASSWORD" > /tmp/kt2.out 2>&1; then
              echo "::warning::ANDROID_KEY_PASSWORD e greșit, dar cheia se deschide cu ANDROID_KEYSTORE_PASSWORD (keystore PKCS12). Folosesc storePassword pentru semnare. Actualizează secretul ANDROID_KEY_PASSWORD ca să fie identic cu ANDROID_KEYSTORE_PASSWORD."
              EFFECTIVE_KEY_PASSWORD="$STORE_PASSWORD"
            else
              echo "::error::ANDROID_KEY_PASSWORD este GREȘITĂ pentru aliasul '$KEY_ALIAS' (și nici storePassword nu o deschide)."
              cat /tmp/kt.out
              echo ""
              echo "Fix: GitHub → Settings → Secrets and variables → Actions → actualizează"
              echo "ANDROID_KEY_PASSWORD (și, dacă e cazul, ANDROID_KEYSTORE_PASSWORD)."
              echo "Pe keystore PKCS12 (default modern) keyPassword TREBUIE să fie identic cu storePassword."
              echo "Dacă nu mai știi parolele și aplicația NU e încă publicată, rulează workflow-ul"
              echo "'Bootstrap Android Upload Key' pentru un keystore nou cu parole fără caractere speciale."
              exit 1
            fi
          fi
          echo "✓ PASS Test 3 — cheia privată se descifrează cu parola efectivă de semnare"
          echo "✓ Toate cele 4 secrete sunt coerente cu același keystore."

          # Scrie keystore.properties cu escaping corect pentru formatul .properties
          # (backslash, :, =, #, ! și spații trebuie escapate, altfel parola ajunge trunchiată).
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' -e 's/=/\\=/g' -e 's/#/\\#/g' -e 's/!/\\!/g' -e 's/ /\\ /g'; }
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$EFFECTIVE_KEY_PASSWORD")"
          } > android/keystore.properties
          echo "keystore.properties scris (valori mascate)."

          # Extrage SHA-256 fingerprint-ul upload key din keystore și patch-uiește
          # assetlinks.json în dist/client (dacă nu e deja acolo) pentru consistență.
          UPLOAD_SHA256="$(keytool -list -v -keystore android/app/release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | awk '{print $2}' || true)"
          if [ -n "$UPLOAD_SHA256" ]; then
            echo "Upload key SHA-256: $UPLOAD_SHA256"
            ASSET_DIST="dist/client/.well-known/assetlinks.json"
            if [ -f "$ASSET_DIST" ]; then
              export UPLOAD_SHA256 ASSET_DIST
              python3 <<'PY' || true
          import json, os
          f = os.environ['ASSET_DIST']
          data = json.load(open(f))
          fps = data[0]['target']['sha256_cert_fingerprints']
          v = os.environ['UPLOAD_SHA256'].strip().upper()
          if v and v not in fps:
              fps.append(v)
          data[0]['target']['sha256_cert_fingerprints'] = fps
          json.dump(data, open(f, 'w'), indent=2)
          print('assetlinks.json (dist) patchat cu upload key SHA-256')
          PY
            fi
          fi


      - name: Injectează signing config în build.gradle (dacă lipsește)
        run: |
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs" "$GRADLE"; then
            echo "Adding signingConfigs block..."
            # Inserează după linia "android {"
            python3 <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          signing = """
              signingConfigs {
                  release {
                      def props = new Properties()
                      def f = rootProject.file('keystore.properties')
                      if (f.exists()) {
                          props.load(new FileInputStream(f))
                          storeFile file(props['storeFile'])
                          storePassword props['storePassword']
                          keyAlias props['keyAlias']
                          keyPassword props['keyPassword']
                      }
                  }
              }
          """
          s = re.sub(r'(android\s*\{)', r'\1' + signing, s, count=1)
          # Aplică signingConfig pe buildType release
          if 'buildTypes' in s:
              s = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s, count=1
              )
          else:
              # Adaugă întreg blocul buildTypes înainte de închiderea android {}
              build_types = """
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          """
              # Inserează înainte de ultimul } al blocului android
              s = s.rstrip()
              # închide penultimul } (al android)
              idx = s.rfind('}')
              s = s[:idx] + build_types + '\n}\n'
          open(p, 'w').write(s)
          print("Injected signing config.")
          PY
          else
            echo "signingConfigs already present, skipping injection."
          fi
          echo "--- build.gradle after ---"
          cat "$GRADLE"

      - name: Verifică merged manifest (debug + release) — compliance Google Play
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Ambele variante: manifestul de debug poate primi AD_ID din librării
          # (FCM / Play Services) fără să fie observat, iar Play Console
          # avertizează pe baza artefactelor active.
          ./gradlew :app:processDebugManifest :app:processReleaseManifest --no-daemon
          FAIL=0
          for VARIANT in debug release; do
            MERGED="app/build/intermediates/merged_manifests/$VARIANT/AndroidManifest.xml"
            if [ ! -f "$MERGED" ]; then
              MERGED=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged*$VARIANT*" | head -n1)
            fi
            test -f "$MERGED" || { echo "::error::Merged manifest lipsă pentru varianta $VARIANT"; exit 1; }
            echo "--- [$VARIANT] merged manifest: $MERGED ---"

            # 1) AD_ID trebuie să LIPSEASCĂ (Play Console: "app doesn't use advertising ID")
            if grep 'com.google.android.gms.permission.AD_ID' "$MERGED" | grep -qv 'tools:node'; then
              echo "::error::[$VARIANT] AD_ID prezent în merged manifest. Declarația Play este 'No advertising ID' — permisiunea trebuie eliminată."
              grep 'AD_ID' "$MERGED"
              FAIL=1
            else
              echo "✓ [$VARIANT] AD_ID absent din merged manifest"
            fi

            # 2) ACCESS_BACKGROUND_LOCATION trebuie să LIPSEASCĂ (geofencing dormant)
            if grep 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MERGED" | grep -qv 'tools:node'; then
              echo "::error::[$VARIANT] ACCESS_BACKGROUND_LOCATION prezent. Geofencing background nu e activ — permisiunea trebuie eliminată."
              grep 'ACCESS_BACKGROUND_LOCATION' "$MERGED"
              FAIL=1
            else
              echo "✓ [$VARIANT] ACCESS_BACKGROUND_LOCATION absent din merged manifest"
            fi

            if [ "$VARIANT" = "release" ]; then
              # 3) targetSdk >= 36
              TSDK=$(grep -oP 'android:targetSdkVersion="\K[0-9]+' "$MERGED" | head -1 || echo "0")
              if [ -z "$TSDK" ] || [ "$TSDK" -lt 36 ]; then
                echo "::error::targetSdk=$TSDK < 36. Google Play cere targetSdk ≥ 36 (Android 16) pentru încărcări noi."
                FAIL=1
              else
                echo "✓ targetSdk=$TSDK"
              fi
              # 4) requestLegacyExternalStorage trebuie să rămână false după merge.
              #    ioncamera-android îl aduce cu true; `tools:replace` face ca valoarea
              #    noastră să câștige, iar aici confirmăm rezultatul, nu intenția.
              RLES=$(grep -oP 'android:requestLegacyExternalStorage="\K[^"]+' "$MERGED" | head -1 || echo "absent")
              if [ "$RLES" = "true" ]; then
                echo "::error::requestLegacyExternalStorage=true în merged manifest. Storage-ul legacy trebuie să rămână dezactivat."
                FAIL=1
              else
                echo "✓ requestLegacyExternalStorage=$RLES (nu este true)"
              fi
            fi
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "✓✓✓ Compliance Google Play OK (debug + release)"

      - name: Verifică în Play că versionCode-ul este liber (anti "no new app bundles")
        if: ${{ (github.event_name == 'push' || github.event.inputs.skip_play_upload != 'true') && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/check-play-version-code.mjs --package app.suzeta --code ${{ steps.version.outputs.code }}


      - name: Build AAB semnat
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verifică reparațiile direct în AAB
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          TMP="$(mktemp -d)"
          unzip -q "$AAB" -d "$TMP"
          LOGO=$(python3 -c "import re,io;m=re.search(r'SUZETA_ICON_URL\s*=\s*\"([^\"]+)\"', io.open('src/lib/brand-assets.ts',encoding='utf-8').read());print(m.group(1) if m else '')")
          test -s "$TMP/base/assets/public${LOGO}" || {
            echo "::error::AAB-ul final nu conține logo-ul Suzeta local ($LOGO)."
            exit 1
          }
          grep -Rqs "SUZETA_NATIVE_FIX_V3" "$TMP/base/assets/public" || {
            echo "::error::AAB-ul final nu conține markerul reparațiilor native."
            exit 1
          }
          grep -Rqs "$GITHUB_SHA" "$TMP/base/assets/public" || {
            echo "::error::AAB-ul final nu conține SHA-ul $GITHUB_SHA."
            exit 1
          }
          grep -Rqs "signInWithIdToken" "$TMP/base/assets/public" || {
            echo "::error::AAB-ul final nu conține Google Sign-In nativ."
            exit 1
          }
          # versionCode real din manifestul împachetat (protobuf) — nu doar intenția din build.gradle.
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -n1 || true)
          EXPECTED=${{ steps.version.outputs.code }}
          if [ -n "$AAPT2" ]; then
            FOUND=$("$AAPT2" dump xmltree --file base/manifest/AndroidManifest.xml "$AAB" 2>/dev/null \
              | grep -oP 'versionCode\)?=\(?[a-zA-Z0-9]*\)?0x0*\K[0-9a-f]+' | head -n1 || true)
            if [ -n "$FOUND" ]; then
              FOUND_DEC=$((16#$FOUND))
              if [ "$FOUND_DEC" != "$EXPECTED" ]; then
                echo "::error::versionCode din AAB ($FOUND_DEC) diferă de cel așteptat ($EXPECTED)."
                exit 1
              fi
              echo "✓ versionCode în AAB = $FOUND_DEC"
            else
              echo "::warning::Nu am putut citi versionCode din AAB cu aapt2 — rămâne valid gardul din build.gradle."
            fi
          else
            echo "::warning::aapt2 indisponibil — sar peste citirea versionCode din AAB."
          fi
          echo "✓ AAB verificat: versionCode=$EXPECTED, commit=$GITHUB_SHA, marker=SUZETA_NATIVE_FIX_V3"
          rm -rf "$TMP"


      - name: Redenumește AAB-ul pentru livrare
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          DST=android/app/build/outputs/bundle/release/suzeta-diagnostic-build-${{ steps.version.outputs.code }}.aab
          cp "$SRC" "$DST"
          ls -la "$DST"

      - name: Upload artefact AAB (pentru inspecție)
        uses: actions/upload-artifact@v4
        with:
          name: suzeta-diagnostic-build-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/suzeta-diagnostic-build-${{ steps.version.outputs.code }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Pregătește release notes (din fastlane/metadata)
        id: whatsnew
        run: |
          CODE="${{ steps.version.outputs.code }}"
          OUT=distribution/whatsnew
          mkdir -p "$OUT"
          for LOC in ro-RO en-US; do
            SRC="fastlane/metadata/android/$LOC/changelogs/$CODE.txt"
            [ -f "$SRC" ] || SRC="fastlane/metadata/android/$LOC/changelogs/default.txt"
            if [ -f "$SRC" ]; then
              head -c 490 "$SRC" > "$OUT/whatsnew-$LOC"
              echo "✓ $OUT/whatsnew-$LOC (din $SRC)"
            fi
          done
          ls -la "$OUT"

      # ---------------------------------------------------------------
      # SMOKE TEST PE EMULATOR — gardul care lipsea.
      # Instalăm EXACT AAB-ul semnat (convertit în APK universal cu
      # bundletool) pe un emulator API 34 și verificăm că activitatea
      # pornește și RĂMÂNE vie 15 secunde. Orice crash nativ la boot
      # (plugin lipsă, network security config invalid, resursă ruptă)
      # oprește release-ul ÎNAINTE de Google Play.
      # ---------------------------------------------------------------
      - name: Descarcă bundletool
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar /tmp/bundletool.jar version

      - name: Construiește APK universal din AAB
        run: |
          set -euo pipefail
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=/tmp/app.apks --mode=universal \
            --ks=android/app/release.keystore \
            --ks-pass=pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass=pass:"${{ secrets.ANDROID_KEY_PASSWORD }}"
          unzip -o /tmp/app.apks -d /tmp/apks >/dev/null
          ls -la /tmp/apks/universal.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test pornire aplicație (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r /tmp/apks/universal.apk
            adb logcat -c
            adb shell am start -n app.suzeta/app.suzeta.MainActivity
            sleep 15
            if ! adb shell pidof app.suzeta > /dev/null; then
              echo "::error::Aplicația s-a închis singură după pornire (crash la boot)."
              adb logcat -d -t 400 | grep -iE "AndroidRuntime|FATAL|app.suzeta" | tail -80
              exit 1
            fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::FATAL EXCEPTION în logcat la pornire."
              adb logcat -d | grep -A 40 "FATAL EXCEPTION" | tail -80
              exit 1
            fi
            echo "✓ Aplicația pornește și rămâne activă 15s pe emulator API 34."


      # Gardul suplimentar `github.ref`: un dispatch dintr-un branch de lucru nu
      # poate publica nici dacă cineva pune skip_play_upload=false. Tag-urile
      # (refs/tags/v*) rămân neafectate, deci fluxul de release pe tag e intact.
      - name: Detectează mapping.txt (R8)

        id: mapping
        run: |
          set -euo pipefail
          M=android/app/build/outputs/mapping/release/mapping.txt
          if [ -s "$M" ]; then
            echo "path=$M" >> "$GITHUB_OUTPUT"
            echo "✓ mapping.txt găsit (deobfuscare crash-uri activă)"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::mapping.txt lipsește (minifyEnabled=false) — urcăm AAB-ul fără fișier de deobfuscare."
          fi

      - name: Publish în Google Play
        if: ${{ (github.event_name == 'push' || github.event.inputs.skip_play_upload != 'true') && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.suzeta
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'draft' }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: ${{ steps.mapping.outputs.path }}

          changesNotSentForReview: false

      - name: Curăță secretele de pe runner
        if: always()
        run: |
          rm -f android/app/release.keystore android/keystore.properties
