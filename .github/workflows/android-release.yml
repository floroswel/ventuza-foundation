name: Android Release (AAB → Google Play)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      skip_play_upload:
        description: "Doar produce AAB (nu urca pe Play) — activează pt prima urcare manuală"
        required: true
        default: true
        type: boolean
      # Fără valori implicite hardcodate. Aveau `1.0.10` / `10`, iar cel mai mare
      # versionCode construit efectiv este 20 — o rulare cu inputurile lăsate
      # neschimbate ar fi produs un AAB regresiv, respins de Play. Gol =
      # se citește `release/version.json`, sursa de record a proiectului.
      version:
        description: "Versiune SemVer (ex: 1.0.12). Gol = din release/version.json (sau din tag)."
        required: false
        default: ""
        type: string
      version_code:
        description: "versionCode explicit (ex: 21). Gol = din release/version.json (sau derivat din tag)."
        required: false
        default: ""
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build AAB & Upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secretele de release sunt citite din environment-ul GitHub "production".
    # Environment secrets au prioritate față de repository secrets cu același nume.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trasabilitate sursă release
        run: |
          set -euo pipefail
          echo "Workflow event: $GITHUB_EVENT_NAME"
          echo "Git ref: $GITHUB_REF"
          echo "Commit împachetat: $GITHUB_SHA"
          echo "Commit checkout: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::Checkout-ul nu corespunde commitului workflow-ului."
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # Dintr-un branch de lucru se poate produce DOAR artefactul AAB, pentru
            # testare pe device înainte de merge. Publicarea în Play rămâne
            # posibilă exclusiv din main sau prin tag (vezi și gardul de pe pasul
            # „Publish în Google Play").
            if [ "${{ inputs.skip_play_upload }}" != "true" ]; then
              echo "::error::Din alt branch decât main se poate produce doar artefactul AAB. Setează skip_play_upload=true, sau pornește din main pentru publicare."
              exit 1
            fi
            echo "::notice::Build de test din $GITHUB_REF — doar artefact, fără upload în Play."
          fi
          git show -s --format='Commit time: %cI%nSubject: %s' HEAD
          echo "----- Amprenta surselor Android (fără secrete) -----"
          LAYOUT=android-overrides/res/layout/activity_main.xml
          if [ -f "$LAYOUT" ]; then
            echo "SHA-256 $LAYOUT: $(sha256sum "$LAYOUT" | awk '{print $1}')"
          else
            echo "::error::$LAYOUT lipsește din acest commit."
            exit 1
          fi
          # Un dispatch pornit înainte de a împinge un fix construiește HEAD-ul de
          # ATUNCI. Amprenta de mai sus arată imediat dacă rularea conține fixul
          # așteptat, în loc să pară o regresie a aceleiași erori.
          echo "Ultimele 3 commituri împachetate:"
          git log --oneline -3 | sed 's/^/  /'

      - name: Calculează metadatele vizibile ale buildului
        id: buildmeta
        env:
          MANUAL_CODE: ${{ inputs.version_code }}
        run: |
          if [ -n "$MANUAL_CODE" ]; then
            CODE="$MANUAL_CODE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJ MIN PAT <<< "$RAW"
            CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          elif [ -f release/version.json ]; then
            # Sursa de record a proiectului. Până acum era ignorată de workflow,
            # deci `bun run version:bump` nu avea niciun efect pe build.
            CODE="$(python3 -c 'import json;print(json.load(open("release/version.json"))["versionCode"])')"
            echo "versionCode din release/version.json: $CODE"
          else
            echo "::error::versionCode lipsește: nu e dat ca input, nu venim din tag și release/version.json nu există."
            exit 1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Marker UI: Android build $CODE · ${GITHUB_SHA:0:7}"

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (pentru @capacitor/cli — cere >=22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools"

      - name: Install web deps
        run: bun install

      - name: Validează secretele obligatorii pentru release Android
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          MISSING=0
          if [ -z "$VITE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Secretul VITE_GOOGLE_WEB_CLIENT_ID lipsește. Fără el, Google Sign-In nativ (Capacitor → supabase.auth.signInWithIdToken) NU funcționează pe Android. Adaugă în GitHub → Settings → Secrets and variables → Actions valoarea OAuth Client ID de tip 'Web application' din Google Cloud Console (format: xxxxx.apps.googleusercontent.com)."
            MISSING=1
          else
            case "$VITE_GOOGLE_WEB_CLIENT_ID" in
              *.apps.googleusercontent.com) ;;
              *)
                echo "::error::VITE_GOOGLE_WEB_CLIENT_ID='$VITE_GOOGLE_WEB_CLIENT_ID' nu are formatul așteptat (*.apps.googleusercontent.com). Verifică că ai copiat Client ID-ul de tip 'Web application', nu 'Android' sau alt tip."
                MISSING=1
                ;;
            esac
          fi
          if [ "$MISSING" != "0" ]; then
            exit 1
          fi
          echo "✓ VITE_GOOGLE_WEB_CLIENT_ID prezent și cu format valid."

      - name: Validează implementarea Google Sign-In nativ
        run: |
          set -euo pipefail
          grep -q 'mode: "online"' src/lib/native-google-auth.ts || {
            echo "::error::Google Sign-In trebuie să folosească modul online nativ, nu redirect browser/WebView."
            exit 1
          }
          if grep -A12 'SocialLogin.login' src/lib/native-google-auth.ts | grep -q 'scopes:'; then
            echo "::error::Nu trimite scopes custom pe Android: pluginul le respinge fără callback MainActivity; scope-urile standard sunt incluse automat."
            exit 1
          fi
          grep -q 'signInWithIdToken' src/lib/native-google-auth.ts || {
            echo "::error::Schimbul tokenului Google în sesiune lipsește din fluxul nativ."
            exit 1
          }
          echo "✓ Google nativ: online Credential Manager + ID token, fără redirect WebView sau scopes custom."

      - name: Instrumentează diagnosticul nativ Google
        run: |
          set -euo pipefail
          PROVIDER="node_modules/@capgo/capacitor-social-login/android/src/main/java/ee/forgr/capacitor/social/login/GoogleProvider.java"
          test -f "$PROVIDER"
          python3 <<'PY'
          p = "node_modules/@capgo/capacitor-social-login/android/src/main/java/ee/forgr/capacitor/social/login/GoogleProvider.java"
          s = open(p, encoding="utf-8").read()
          needle = 'Log.e(LOG_TAG, "Google Sign-In failed", e);'
          replacement = needle + '\n        recordSuzetaDiagnostic(e);'
          if replacement not in s:
              if needle not in s:
                  raise SystemExit("GoogleProvider s-a schimbat: punctul de instrumentare lipsește")
              s = s.replace(needle, replacement, 1)
          helper_anchor = '    private void handleSignInError(GetCredentialException e, PluginCall call, JSONObject config) {'
          helper = "\n".join([
              '    private void recordSuzetaDiagnostic(Throwable error) {',
              '        try {',
              '            Class<?> activityClass = Class.forName("app.suzeta.MainActivity");',
              '            java.lang.reflect.Method method = activityClass.getMethod("recordGoogleDiagnostic", String.class, Throwable.class);',
              '            method.invoke(null, "credential_error", error);',
              '        } catch (Throwable ignored) {',
              '            // Diagnosticul nu trebuie sa afecteze autentificarea.',
              '        }',
              '    }',
              '',
              '',
          ])
          if helper not in s:
              if helper_anchor not in s:
                  raise SystemExit("GoogleProvider s-a schimbat: ancora helper-ului lipsește")
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -q 'recordSuzetaDiagnostic(e)' "$PROVIDER"
          echo "✓ Excepția Credential Manager va fi capturată în diagnosticul din aplicație."

      - name: Build web bundle
        env:
          # Publishable keys (safe în bundle). Fallback la valorile din .env dacă lipsesc secretele repo.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://szzxhvvmwqvfyoldcuyz.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6enhodnZtd3F2ZnlvbGRjdXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzE5NTUsImV4cCI6MjA5NzU0Nzk1NX0.Wf-m_9h3GtQMV6zC6L6ti4ZlR1HCqqHhw4f5ilE-LTs' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'szzxhvvmwqvfyoldcuyz' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Google Web OAuth client ID (Web application type din Google Cloud Console).
          # Necesar pentru Google Sign-In nativ (Capacitor) — pasat la
          # `supabase.auth.signInWithIdToken` ca `audience`. Fără el, butonul
          # Google din Android nativ nu funcționează (cade back la web OAuth).
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          # Fingerprint-urile sunt publice; setează-le ca GitHub Environment variables.
          # Diagnosticul compară SHA-1-ul APK-ului instalat cu toate trei, fără presupuneri.
          VITE_ANDROID_APP_SIGNING_SHA1: ${{ vars.ANDROID_APP_SIGNING_SHA1 }}
          VITE_ANDROID_UPLOAD_SHA1: ${{ vars.ANDROID_UPLOAD_SHA1 }}
          VITE_ANDROID_IAS_SHA1: ${{ vars.ANDROID_IAS_SHA1 }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_VERSION_CODE: ${{ steps.buildmeta.outputs.code }}
        run: bun run build:mobile


      - name: Verifică bundle-ul web (dist/client/index.html)
        run: |
          INDEX=dist/client/index.html
          if [ ! -f "$INDEX" ]; then
            echo "::error::$INDEX lipsește — build:mobile nu a produs bundle-ul. Capacitor ar împacheta un webDir gol."
            echo "Conținut dist/ (dacă există):"
            ls -la dist/ 2>/dev/null || echo "  (dist/ nu există)"
            ls -la dist/client/ 2>/dev/null || echo "  (dist/client/ nu există)"
            exit 1
          fi
          SIZE=$(stat -c%s "$INDEX")
          if [ "$SIZE" -lt 200 ]; then
            echo "::error::$INDEX este suspect de mic ($SIZE bytes) — probabil build incomplet."
            exit 1
          fi
          if ! grep -q "<div id=\"root\"" "$INDEX" && ! grep -qi "<body" "$INDEX"; then
            echo "::error::$INDEX nu conține markup HTML așteptat (root/body). Abort înainte de cap sync."
            head -c 500 "$INDEX"
            exit 1
          fi
          echo "✓ $INDEX OK ($SIZE bytes)"
          test -s dist/client/brand/suzeta-icon.png || {
            echo "::error::Logo-ul local lipsește din dist/client/brand/."
            exit 1
          }
          grep -Rqs "SUZETA_NATIVE_FIX_V3" dist/client || {
            echo "::error::Markerul reparațiilor native lipsește din bundle."
            exit 1
          }
          grep -Rqs "signInWithIdToken" dist/client || {
            echo "::error::Fluxul Google signInWithIdToken lipsește din bundle."
            exit 1
          }
          grep -Rqs "${GITHUB_SHA}" dist/client || {
            echo "::error::SHA-ul workflow-ului nu a fost injectat în bundle."
            exit 1
          }
          echo "✓ Bundle verificat: logo local + Google nativ + marker + SHA $GITHUB_SHA"

      - name: Add Android platform (dacă lipsește)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Verifică bundle-ul copiat în proiectul Android
        run: |
          set -euo pipefail
          NATIVE_ASSETS=android/app/src/main/assets/public
          test -s "$NATIVE_ASSETS/brand/suzeta-icon.png" || {
            echo "::error::Logo-ul local nu a ajuns în assets/public din Android."
            exit 1
          }
          grep -Rqs "SUZETA_NATIVE_FIX_V3" "$NATIVE_ASSETS" || {
            echo "::error::Capacitor a copiat un bundle fără reparațiile native."
            exit 1
          }
          grep -Rqs "$GITHUB_SHA" "$NATIVE_ASSETS" || {
            echo "::error::Bundle-ul Android nu corespunde commitului $GITHUB_SHA."
            exit 1
          }
          echo "✓ Assets Android provin din $GITHUB_SHA și conțin reparațiile native."

      - name: Generează iconițe + splash nativ (@capacitor/assets)
        run: |
          set -e
          if [ ! -f assets/logo.png ]; then
            echo "::error::assets/logo.png lipsește — iconița ar rămâne cea default Capacitor."
            exit 1
          fi
          bunx @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#0B0B10' \
            --iconBackgroundColorDark '#0B0B10' \
            --splashBackgroundColor '#0B0B10' \
            --splashBackgroundColorDark '#0B0B10'
          echo "✓ Iconițe + splash generate din assets/"


      - name: Aplică android-overrides (compliance Google Play targetSdk 35 + no AD_ID + no background location)
        run: |
          set -e
          # 1) variables.gradle — pin targetSdk/compileSdk 35
          if [ -f android-overrides/variables.gradle ]; then
            cp android-overrides/variables.gradle android/variables.gradle
            echo "✓ variables.gradle override aplicat (targetSdk=35)"
          fi

          # 2) AndroidManifest — adaugă xmlns:tools + node="remove" pentru AD_ID + ACCESS_BACKGROUND_LOCATION
          python3 <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          # a) namespace tools
          if 'xmlns:tools="http://schemas.android.com/tools"' not in s:
              s = s.replace(
                  '<manifest',
                  '<manifest xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )
          # b) remove AD_ID + păstrează permisiunile foreground necesare locației native
          if 'com.google.android.gms.permission.AD_ID' not in s or 'tools:node="remove"' not in s:
              # scoate orice ocurență existentă (pentru a evita duplicate)
              s = re.sub(
                  r'\s*<uses-permission[^>]*android:name="com\.google\.android\.gms\.permission\.AD_ID"[^/]*/>',
                  '',
                  s,
              )
              inject = (
                  '\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"\n'
                  '                     tools:node="remove"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"\n'
                  '                     tools:node="remove"/>\n'
              )
              s = s.replace('</manifest>', inject + '</manifest>', 1)
          for permission in (
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
          ):
              if permission not in s:
                  s = s.replace(
                      '</manifest>',
                      f'    <uses-permission android:name="{permission}"/>\n</manifest>',
                      1,
                  )
          # c) network security config (HTTPS-only, fără CA-uri user în release)
          if 'android:networkSecurityConfig' not in s:
              s = s.replace(
                  '<application',
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
          s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          # d) hardening <application>: fără backup, fără cleartext, fără legacy storage
          app_attrs = {
              'android:allowBackup': 'false',
              'android:fullBackupContent': 'false',
              'android:dataExtractionRules': None,  # gestionat separat mai jos
              'android:usesCleartextTraffic': 'false',
              'android:requestLegacyExternalStorage': 'false',
          }
          for attr, val in app_attrs.items():
              if val is None:
                  continue
              if re.search(rf'<application[^>]*{re.escape(attr)}=', s):
                  s = re.sub(rf'({re.escape(attr)}=")[^"]*(")', rf'\g<1>{val}\g<2>', s, count=1)
              else:
                  s = s.replace('<application', f'<application {attr}="{val}"', 1)
          # d2) tools:replace — impune valorile noastre peste cele din biblioteci.
          #     io.ionic.libs:ioncamera-android:1.0.1 (dependenta nativa a
          #     @capacitor/camera) declara requestLegacyExternalStorage="true".
          #     Fara acest marcaj, manifest merger opreste build-ul la
          #     :app:processReleaseMainManifest cu "Attribute
          #     application@requestLegacyExternalStorage value=(false) ... is also
          #     present at ... value=(true)". Pastram false: nu slabim protectia,
          #     doar declaram explicit ca a noastra castiga.
          REPLACE_ATTRS = ['android:requestLegacyExternalStorage']
          m_app = re.search(r'<application\b[^>]*>', s)
          if not m_app:
              raise SystemExit("<application> nu a fost gasit in AndroidManifest.xml")
          app_tag = m_app.group(0)
          existing = re.search(r'tools:replace="([^"]*)"', app_tag)
          if existing:
              current = [x.strip() for x in existing.group(1).split(',') if x.strip()]
              merged = current + [a for a in REPLACE_ATTRS if a not in current]
              new_app = app_tag.replace(existing.group(0), 'tools:replace="%s"' % ','.join(merged))
          else:
              new_app = app_tag.replace(
                  '<application', '<application tools:replace="%s"' % ','.join(REPLACE_ATTRS), 1
              )
          s = s.replace(app_tag, new_app, 1)
          # e) hardening MainActivity: singleTask + portrait + adjustPan
          m = re.search(r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>', s)
          if m:
              tag = m.group(0)
              new_tag = tag
              for attr, val in (
                  ('android:launchMode', 'singleTask'),
                  ('android:screenOrientation', 'portrait'),
                  # `adjustPan` cerea Android-ului sa mute fereastra, ceea ce
                  # intra in conflict cu edge-to-edge (decorFitsSystemWindows=false)
                  # si cu redimensionarea din pluginul Keyboard. `adjustResize`
                  # este modul in care insetul `Type.ime()` se propaga corect
                  # catre listenerul din MainActivity; fereastra nu se
                  # redimensioneaza oricum in edge-to-edge, deci nu apare o a
                  # doua compensare.
                  ('android:windowSoftInputMode', 'adjustResize'),
                  ('android:exported', 'true'),
              ):
                  if f'{attr}=' in new_tag:
                      new_tag = re.sub(rf'({re.escape(attr)}=")[^"]*(")', rf'\g<1>{val}\g<2>', new_tag, count=1)
                  else:
                      new_tag = new_tag.replace('<activity', f'<activity {attr}="{val}"', 1)
              s = s.replace(tag, new_tag, 1)
          else:
              raise SystemExit("MainActivity nu a fost găsit în AndroidManifest.xml")
          open(p, 'w').write(s)
          print("✓ AndroidManifest.xml patched (security attrs + activity hardening + networkSecurityConfig)")

          PY

          # 3) Copiere resurse override dacă există (icon monochrome, splash)
          if [ -d android-overrides/res ]; then
            # 3a) Validare ÎNAINTE de copiere: dacă sursa e malformată, oprim aici,
            #     nu după ce am contaminat proiectul Android. XML 1.0 §2.5 interzice
            #     secvența de două liniuțe în comentarii, iar AAPT respinge fișierul.
            python3 - <<'PY'
          import glob, sys, re
          import xml.etree.ElementTree as ET
          bad = []
          for f in sorted(glob.glob("android-overrides/res/**/*.xml", recursive=True)):
              try:
                  ET.parse(f)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          layout = "android-overrides/res/layout/activity_main.xml"
          try:
              src = open(layout, encoding="utf-8").read()
              for m in re.finditer(r"<!--.*?-->", src, re.S):
                  if "--" in m.group(0)[4:-3]:
                      bad.append(f"{layout}: comentariu cu secvența interzisă de XML 1.0 §2.5")
          except FileNotFoundError:
              bad.append(f"{layout}: lipsește")
          for b in bad:
              print(f"::error::Sursă override invalidă — {b}")
          if bad:
              sys.exit(1)
          print("✓ Sursele XML din android-overrides/res sunt valide (pre-copiere).")
          PY
            cp -rv android-overrides/res/* android/app/src/main/res/
            echo "✓ Resurse override copiate din android-overrides/res/"
            # 3b) Validare DUPĂ copiere + amprente identice, ca să excludem orice
            #     alterare la copiere sau un fișier preexistent rămas necopiat.
            SRC=android-overrides/res/layout/activity_main.xml
            DST=android/app/src/main/res/layout/activity_main.xml
            python3 -c "import xml.etree.ElementTree as ET,sys; ET.parse('$DST')" || {
              echo "::error::$DST nu parsează după copiere."
              exit 1
            }
            H_SRC="$(sha256sum "$SRC" | awk '{print $1}')"
            H_DST="$(sha256sum "$DST" | awk '{print $1}')"
            echo "SHA-256 sursă      : $H_SRC"
            echo "SHA-256 destinație : $H_DST"
            if [ "$H_SRC" != "$H_DST" ]; then
              echo "::error::Layout-ul copiat diferă de sursă — override-ul nu s-a aplicat corect."
              exit 1
            fi
            echo "✓ activity_main.xml parsează și este identic cu sursa."
          fi

          # 4) MainActivity override — expune SHA-1/SHA-256 al semnăturii instalate
          #    către WebView pentru panoul de diagnostic din /auth.
          if [ -f android-overrides/MainActivity.java ]; then
            DEST=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
            if [ -z "$DEST" ]; then DEST=android/app/src/main/java/app/suzeta; mkdir -p "$DEST"; fi
            cp android-overrides/MainActivity.java "$DEST/MainActivity.java"
            echo "✓ MainActivity override aplicat în $DEST"
          fi

          # 4b) ProGuard/R8 — păstrează metodele @JavascriptInterface (altfel
          #     diagnosticul nativ întoarce null pentru SHA/versiuni).
          if [ -f android-overrides/proguard-rules.pro ]; then
            cat android-overrides/proguard-rules.pro >> android/app/proguard-rules.pro
            echo "✓ Reguli ProGuard adăugate"
          fi


      - name: Validează resursele Android (PNG/XML/duplicate/referințe lipsă)
        run: |
          python3 <<'PY'
          import os, re, sys, glob, struct
          import xml.etree.ElementTree as ET
          RES = "android/app/src/main/res"
          errors, warns = [], []

          # 1) Fișiere imagine valide (AAPT compilează doar PNG/JPEG/WEBP reale)
          MAGIC = {b'\x89PNG': 'png', b'\xff\xd8': 'jpg', b'RIFF': 'webp'}
          for p in glob.glob(f"{RES}/**/*", recursive=True):
              if not os.path.isfile(p):
                  continue
              ext = p.rsplit('.', 1)[-1].lower()
              if ext not in ('png', 'jpg', 'jpeg', 'webp', '9.png'):
                  continue
              head = open(p, 'rb').read(4)
              kind = next((v for k, v in MAGIC.items() if head.startswith(k)), None)
              if kind is None:
                  errors.append(f"{p}: nu este imagine validă (magic={head!r})")
              elif kind == 'png' and ext != 'png':
                  warns.append(f"{p}: conținut PNG cu extensie .{ext}")
              elif kind == 'jpg' and ext == 'png':
                  errors.append(f"{p}: JPEG deghizat în .png — AAPT eșuează")

          # 2) XML parsabil
          xmls = glob.glob(f"{RES}/**/*.xml", recursive=True)
          for p in xmls:
              try:
                  ET.parse(p)
              except Exception as e:
                  errors.append(f"{p}: XML invalid ({e})")

          # 3) Duplicate în values/ (același type+name în același config)
          seen = {}
          for p in glob.glob(f"{RES}/values*/**/*.xml", recursive=True) + glob.glob(f"{RES}/values*/*.xml"):
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              cfg = os.path.basename(os.path.dirname(p))
              for el in root:
                  if not isinstance(el.tag, str):
                      continue
                  name = el.get('name')
                  if not name:
                      continue
                  typ = el.get('type') if el.tag == 'item' else el.tag
                  key = (cfg, typ, name)
                  if key in seen and seen[key] != p:
                      errors.append(f"Duplicate resource {typ}/{name} în {cfg}: {seen[key]} + {p}")
                  seen[key] = p

          # 4) Referințe @drawable/@mipmap/@color/@style lipsă din XML-urile proprii
          defined_files = set()
          for p in glob.glob(f"{RES}/**/*", recursive=True):
              if os.path.isfile(p) and '/values' not in p:
                  typ = os.path.basename(os.path.dirname(p)).split('-')[0]
                  nm = os.path.basename(p).split('.')[0]
                  defined_files.add((typ, nm))
          defined_values = {(t, n) for (_c, t, n) in seen}
          for p in xmls:
              src = open(p, encoding='utf-8', errors='ignore').read()
              for typ, nm in re.findall(r'"@(drawable|mipmap|color|style|string)/([A-Za-z0-9_]+)"', src):
                  if (typ, nm) in defined_files or (typ, nm) in defined_values:
                      continue
                  # aliasuri color/drawable pot fi definite cross-type
                  if any((t, nm) in defined_values or (t, nm) in defined_files for t in ('color', 'drawable', 'mipmap', 'style', 'string')):
                      continue
                  errors.append(f"{p}: referință lipsă @{typ}/{nm}")

          for w in warns:
              print(f"::warning::{w}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"✓ Resurse Android validate: {len(xmls)} XML, {len(seen)} valori, 0 probleme")
          PY




      - name: Injectează google-services.json (FCM)
