          fi

      - name: Wire Firebase (google-services plugin + firebase-messaging)
        run: |
          ROOT_GRADLE=android/build.gradle
          APP_GRADLE=android/app/build.gradle
          # Plugin la nivel de root (dacă nu există deja)
          if ! grep -q "com.google.gms:google-services" "$ROOT_GRADLE"; then
            python3 <<'PY'
          p = "android/build.gradle"
          s = open(p).read()
          if "dependencies {" in s:
              s = s.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
          open(p, 'w').write(s)
