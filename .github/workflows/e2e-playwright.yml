name: e2e-playwright

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e-playwright.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-playwright.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Turnstile — folosim explicit site key-ul public de test Cloudflare
      # (bypass, "always passes"). Fără site key, TurnstileWidget intră în
      # fail-open, dar preferăm keia de test ca să exersăm calea reală
      # `captchaToken`. Secretul (server) e opțional în CI — nu îl setăm.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.E2E_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
      # Supabase — publishable + URL sunt necesare pentru build și pentru
      # sondele REST din testele e2e. Setate ca Repository Variables (public).
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      # Sesiunea injectată e OPȚIONALĂ. Fără ea, testele autenticate se
      # skip-uiesc automat (LOVABLE_BROWSER_AUTH_STATUS=signed_out).
      LOVABLE_BROWSER_AUTH_STATUS: ${{ secrets.E2E_SUPABASE_SESSION_JSON && 'injected' || 'signed_out' }}
      LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
      LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
      LOVABLE_BROWSER_SUPABASE_ACCESS_TOKEN: ${{ secrets.E2E_SUPABASE_ACCESS_TOKEN }}
      LOVABLE_BROWSER_SUPABASE_COOKIES_JSON: ${{ secrets.E2E_SUPABASE_COOKIES_JSON }}
      E2E_BASE_URL: http://localhost:8080
      # Testele care scriu în DB (edit profil, upload real) rămân opt-in.
      E2E_ALLOW_REAL_WRITE: ${{ vars.E2E_ALLOW_REAL_WRITE || '' }}
      E2E_ALLOW_REAL_UPLOAD: ${{ vars.E2E_ALLOW_REAL_UPLOAD || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Lockfile-ul proiectului este `bun.lock` (text), nu `bun.lockb`.
          # `hashFiles('bun.lockb')` returna string gol, deci cheia degenera în
          # constanta `<os>-bun-` și restaura un node_modules vechi peste care
          # `bun install --frozen-lockfile` nu se reconcilia complet — de aici
          # „Cannot find package '@babel/code-frame'" la pornirea dev serverului.
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.47.*"
          python -m playwright install --with-deps chromium

      - name: Write .env for Vite
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
          VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
          VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
          SUPABASE_URL=${VITE_SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
          EOF

      - name: Start dev server
        run: |
          nohup bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          # Așteaptă până răspunde 8080 (max 90s)
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server didn't start"; tail -100 /tmp/dev.log; exit 1

      - name: Run Playwright e2e
        id: e2e
        run: |
          set +e
          fails=0
          for f in tests/e2e/*.py; do
            echo "::group::$f"
            python "$f"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then fails=$((fails+1)); fi
          done
          echo "failed_suites=$fails" >> $GITHUB_OUTPUT
          exit $fails

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then kill -9 "$(cat /tmp/dev.pid)" 2>/dev/null || true; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log
          if-no-files-found: ignore
          retention-days: 7
