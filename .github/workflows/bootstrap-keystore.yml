name: Bootstrap Android Upload Key — Suzeta (o singură dată)

# Rulează manual din GitHub → Actions → Bootstrap Android Keystore → Run workflow.
# Generează un keystore RSA-4096 + parole random, îl împachetează ca artefact
# (retenție 1 zi) și afișează instrucțiuni pentru salvarea în GitHub Secrets.
#
# IMPORTANT: după ce descarci artefactul:
#   1. salvează `release.keystore` + `keystore-info.txt` în 1Password/Bitwarden
#      (pierderea keystore-ului = nu mai poți publica update-uri sub același
#      package name, niciodată).
#   2. adaugă valorile în Repo Settings → Secrets → Actions (production env):
#        ANDROID_KEYSTORE_BASE64      ← conținut din release.keystore.b64
#        ANDROID_KEYSTORE_PASSWORD    ← din keystore-info.txt
#        ANDROID_KEY_ALIAS            ← din keystore-info.txt
#        ANDROID_KEY_PASSWORD         ← din keystore-info.txt
#   3. șterge artefactul din Actions (butonul Delete) după ce l-ai salvat.

on:
  workflow_dispatch:
    inputs:
      cn:
        description: "Common Name (ex: Suzeta App)"
        required: true
        default: "Suzeta App"
      org:
        description: "Organizație (O)"
        required: true
        default: "Suzeta"
      country:
        description: "Cod țară (C, 2 litere)"
        required: true
        default: "RO"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generează keystore + parole random
        run: |
          mkdir -p out
          STORE_PASS=$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-24)
          # PKCS12 folosește aceeași parolă pentru container și cheia privată.
          KEY_PASS="$STORE_PASS"
          ALIAS="suzeta-upload"

          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${{ inputs.cn }}, O=${{ inputs.org }}, C=${{ inputs.country }}"

          base64 -w 0 out/release.keystore > out/release.keystore.b64
          sha256sum out/release.keystore | awk '{print $1}' > out/release.keystore.sha256

          cat > out/keystore-info.txt <<EOF
          ================================================================
          UPLOAD KEY SUZETA (Play App Signing) — SALVEAZĂ ÎN PASSWORD MANAGER, NU PIERDE!
          ================================================================

          Fișier keystore:   release.keystore  (binar, ține-l offline)
          Base64 pt secret:  release.keystore.b64 (copiază TOT conținutul)
          SHA-256 verificare: $(cat out/release.keystore.sha256)

          ----------------------------------------------------------------
          GitHub Secrets (Repo Settings → Secrets → Actions, env "production"):
          ----------------------------------------------------------------
          ANDROID_KEYSTORE_BASE64    = <conținutul fișierului release.keystore.b64>
          ANDROID_KEYSTORE_PASSWORD  = ${STORE_PASS}
          ANDROID_KEY_ALIAS          = ${ALIAS}
          ANDROID_KEY_PASSWORD       = ${KEY_PASS}

          Pentru PKCS12, ANDROID_KEY_PASSWORD este intenționat identic cu
          ANDROID_KEYSTORE_PASSWORD.

          ----------------------------------------------------------------
          După ce ai salvat totul:
          1. Șterge acest artefact din Actions (Delete).
          2. Rulează workflow-ul "Android Release" pentru a construi AAB-ul.
          ================================================================
          EOF

      - name: Instrucțiuni în rezumatul rulării (fără parole)
        run: |
          set -euo pipefail
          {
            echo "## Upload key generat ✅"
            echo ""
            echo "| Câmp | Valoare |"
            echo "|---|---|"
            echo "| Alias | \`suzeta-upload\` |"
            echo "| Algoritm | RSA 4096, valabil 10000 zile |"
            echo "| SHA-256 keystore | \`$(cat out/release.keystore.sha256)\` |"
            echo "| Dimensiune base64 | $(wc -c < out/release.keystore.b64) caractere |"
            echo ""
            echo "### Pași (5 minute, o singură dată)"
            echo ""
            echo "1. Descarcă artefactul **android-keystore-BACKUP-IMMEDIATELY** de mai jos."
            echo "2. Salvează \`release.keystore\` + \`keystore-info.txt\` în 1Password/Bitwarden. **Pierderea = nu mai poți publica update-uri sub \`app.suzeta\`.**"
            echo "3. Repo → **Settings → Environments → production → Add secret** și adaugă exact:"
            echo ""
            echo "| Nume secret | Valoare (din artefact) |"
            echo "|---|---|"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | tot conținutul fișierului \`release.keystore.b64\` (o singură linie, fără spații/ghilimele) |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | linia \`ANDROID_KEYSTORE_PASSWORD =\` din \`keystore-info.txt\` |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`suzeta-upload\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | identică cu \`ANDROID_KEYSTORE_PASSWORD\` (keystore PKCS12) |"
            echo ""
            echo "4. Șterge artefactul din această rulare după ce l-ai salvat."
            echo "5. Rulează **Android Release** — pasul *Preflight secrete* confirmă că totul e complet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefact (1 zi retenție)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-BACKUP-IMMEDIATELY
          path: out/
          retention-days: 1
          if-no-files-found: error

