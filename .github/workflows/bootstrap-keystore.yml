name: Bootstrap Android Keystore (o singură dată)

# Rulează manual din GitHub → Actions → Bootstrap Android Keystore → Run workflow.
# Generează un keystore RSA-4096 + parole random, îl împachetează ca artefact
# (retenție 1 zi) și afișează instrucțiuni pentru salvarea în GitHub Secrets.
#
# IMPORTANT: după ce descarci artefactul:
#   1. salvează `release.keystore` + `keystore-info.txt` în 1Password/Bitwarden
#      (pierderea keystore-ului = nu mai poți publica update-uri sub același
#      package name, niciodată).
#   2. adaugă valorile în Repo Settings → Secrets → Actions (production env):
#        ANDROID_KEYSTORE_BASE64      ← conținut din release.keystore.b64
#        ANDROID_KEYSTORE_PASSWORD    ← din keystore-info.txt
#        ANDROID_KEY_ALIAS            ← din keystore-info.txt
#        ANDROID_KEY_PASSWORD         ← din keystore-info.txt
#   3. șterge artefactul din Actions (butonul Delete) după ce l-ai salvat.

on:
  workflow_dispatch:
    inputs:
      cn:
        description: "Common Name (ex: Ventuza App)"
        required: true
        default: "Ventuza App"
      org:
        description: "Organizație (O)"
        required: true
        default: "Ventuza"
      country:
        description: "Cod țară (C, 2 litere)"
        required: true
        default: "RO"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generează keystore + parole random
        run: |
          mkdir -p out
          STORE_PASS=$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-24)
          KEY_PASS=$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-24)
          ALIAS="ventuza"

          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${{ inputs.cn }}, O=${{ inputs.org }}, C=${{ inputs.country }}"

          base64 -w 0 out/release.keystore > out/release.keystore.b64

          cat > out/keystore-info.txt <<EOF
          ================================================================
          KEYSTORE VENTUZA — SALVEAZĂ ÎN PASSWORD MANAGER, NU PIERDE!
          ================================================================

          Fișier keystore:   release.keystore  (binar, ține-l offline)
          Base64 pt secret:  release.keystore.b64 (copiază TOT conținutul)

          ----------------------------------------------------------------
          GitHub Secrets (Repo Settings → Secrets → Actions, env "production"):
          ----------------------------------------------------------------
          ANDROID_KEYSTORE_BASE64    = <conținutul fișierului release.keystore.b64>
          ANDROID_KEYSTORE_PASSWORD  = ${STORE_PASS}
          ANDROID_KEY_ALIAS          = ${ALIAS}
          ANDROID_KEY_PASSWORD       = ${KEY_PASS}

          ----------------------------------------------------------------
          După ce ai salvat totul:
          1. Șterge acest artefact din Actions (Delete).
          2. Rulează workflow-ul "Android Release" pentru a construi AAB-ul.
          ================================================================
          EOF

      - name: Upload artefact (1 zi retenție)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-BACKUP-IMMEDIATELY
          path: out/
          retention-days: 1
          if-no-files-found: error
