// Suzeta — Android SDK & version pins (Google Play compliance).
//
// Copiază DUPĂ `npx cap add android` în `android/variables.gradle` (peste
// fișierul generat de Capacitor). Google Play cere `targetSdk >= 34`
// din 31 august 2025 pentru aplicații existente și de la launch pentru
// aplicații noi. Compile SDK trebuie să se alinieze.
//
// Sursa autoritativă pentru bump: `release/version.json` +
// `scripts/bump-android-version.mjs`.
ext {
    // 24 = Android 7.0. Obligatoriu: io.ionic.libs:ioncamera-android cere minSdk 24.
    // NU folosi tools:overrideLibrary — duce la crash-uri la runtime.
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.3'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.5'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
