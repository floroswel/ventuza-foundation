// Include din android/app/build.gradle astfel:
//   apply from: "../../release/android-version.gradle"
//   android { defaultConfig { versionCode project.ext.suzetaVersionCode
//                             versionName project.ext.suzetaVersionName } }
//
// Citește release/version.json ca sursă unică pentru versionCode / versionName.
import groovy.json.JsonSlurper

def versionFile = new File(rootDir, "../release/version.json")
if (!versionFile.exists()) {
    throw new GradleException("release/version.json lipsă — rulează `bun run version:bump` sau editează manual.")
}
def parsed = new JsonSlurper().parse(versionFile)
project.ext.suzetaVersionCode = parsed.versionCode as int
project.ext.suzetaVersionName = parsed.versionName as String
println "[suzeta] versionCode=${project.ext.suzetaVersionCode} versionName=${project.ext.suzetaVersionName}"
